[package]
name = "e-kassam"
version = "1.3.1"
description = "e-Kassam — kassir ilovasi"
authors = ["e-Kassam"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auto-update. ⚠ Bu ikkitasi «ortiqcha plagin» EMAS (pastdagi main.rs
# izohiga qarang): `updater` yangilanishni yuklab olib o'rnatadi,
# `process` esa o'rnatishdan keyin ilovani qayta ishga tushiradi —
# usiz kassir eski oynada qolib ketardi.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Chek printeri Windows drayveri orqali boshqariladi (winspool).
# `features` ATAYLAB tor: `windows` krateyi juda katta va kerak bo'lmagan
# modullar qurilish vaqtini bir necha daqiqaga uzaytiradi.
# ⚠ To'RTALA xususiyat ham KERAK va ularni "ortiqcha" deb qisqartirmang.
# `windows` krateyida winspool funksiyalari boshqa modullarga bog'liq:
#   Win32_Graphics_Gdi → `OpenPrinterW`, `PRINTER_INFO_2W` (printer DEVMODE
#                        bilan ishlagani uchun GDI turlariga tayanadi)
#   Win32_Security     → `PRINTER_INFO_2W` (xavfsizlik deskriptori maydoni)
# Ular yo'q bo'lsa kompilyator "topilmadi" deydi va sababi ko'rinmaydi —
# element mavjud, lekin `#[cfg(feature = ...)]` ortida yashiringan bo'ladi.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",         # HANDLE, BOOL
    "Win32_Graphics_Printing",  # winspool: OpenPrinter, WritePrinter, EnumPrinters
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }

[profile.release]
# Kassa kompyuterlari kuchsiz — ilova hajmi va ishga tushish tezligi muhim.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
