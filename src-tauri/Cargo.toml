[package]
name = "e-kassam"
version = "1.0.0"
description = "e-Kassam — kassir ilovasi"
authors = ["e-Kassam"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Chek printeri Windows drayveri orqali boshqariladi (winspool).
# `features` ATAYLAB tor: `windows` krateyi juda katta va kerak bo'lmagan
# modullar qurilish vaqtini bir necha daqiqaga uzaytiradi.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_System_Com",
] }

[profile.release]
# Kassa kompyuterlari kuchsiz — ilova hajmi va ishga tushish tezligi muhim.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
