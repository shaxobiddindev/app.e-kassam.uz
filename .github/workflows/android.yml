name: Android ilova (.apk)

# Kassa ilovasining Android APK'si — Capacitor qobig'ida.
#
# ⚠ RELIZ HAR DOIM `prerelease` VA DOIMIY `android-latest` TEGI BILAN.
# Sabab: `releases/latest` allaqachon DESKTOPNIKI — u yerda `latest.json`
# (auto-update manifesti) va `e-Kassam-setup.exe` doimiy havolasi yashaydi.
# Android relizi «latest» bo'lib qolsa, barcha kassalarning auto-update'i
# va saytdagi Windows havolasi JIMGINA sinardi. `prerelease` esa `latest`
# hisobiga kirmaydi. Saytdagi Android tugmasi doimiy havolaga bog'lanadi:
#   /releases/download/android-latest/e-kassam.apk

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ⚠ 22 dan past bo'lmasin: Capacitor CLI 8 `>=22` talab qiladi va
      # 20 bilan build oxirida `[fatal]` bilan yiqiladi (bir marta shunday
      # yiqilgan — lokalda Node 24 bo'lgani uchun sezilmagan).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ⚠ Capacitor 8 android kutubxonasi Java 21 bilan kompilyatsiya
      # qilinadi — 17 bilan «invalid source release: 21» (bir marta yiqilgan).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bog'liqliklar
        run: npm ci

      - name: Web build + Capacitor sync
        run: |
          npm run build
          npx cap sync android

      # ⚠ IMZO KALITISIZ QURILISH YIQILADI — va bu ATAYLAB (desktop bilan
      # bir qoida). Debug kalit har runner'da HAR XIL bo'lgani uchun
      # birinchi relizlar bir-birining ustiga o'rnatilmasdi.
      # Sirlar: Settings → Secrets → ANDROID_KEYSTORE_BASE64 / _PASSWORD.
      - name: Imzo kaliti bormi
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "ANDROID_KEYSTORE_BASE64 sirri qo'yilmagan — imzosiz APK yangilanish sifatida O'RNATILMAYDI."
            exit 1
          fi
          echo "Kalit joyida."

      # versionCode — epoch-daqiqa: har APK avvalgisidan katta raqam bilan
      # chiqadi va o'rnatilganining USTIGA tushadi (build-apk.sh bilan bir xil).
      - name: Gradle assembleRelease (imzolangan)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # ⚠ Telegram «Native Login» SDK GitHub Packages'da va TOKENSIZ
          # bermaydi. Secret qo'yilmagan bo'lsa APK AVVALGIDEK yig'iladi —
          # shunchaki nativ kirish tugmasi bo'lmaydi (build.gradle dagi
          # shartga qarang). Ya'ni bu secret majburiy emas.
          GITHUB_ACTOR: ${{ github.actor }}
          GHPR_TOKEN: ${{ secrets.GHPR_TOKEN }}
        run: |
          echo "$KS" | base64 -d > /tmp/ekassam.keystore
          VCODE=$(( $(date +%s) / 60 ))
          VNAME="$(date -u +%Y.%m.%d-%H%M)"
          cd android
          ./gradlew --console=plain assembleRelease \
            -PappVersionCode="$VCODE" -PappVersionName="$VNAME" \
            -PsignKeystore=/tmp/ekassam.keystore -PsignPassword="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../e-kassam.apk

      - name: APK artifakti (ishlab chiquvchi uchun)
        uses: actions/upload-artifact@v4
        with:
          name: e-kassam-apk
          path: e-kassam.apk
          if-no-files-found: error

      # Doimiy `android-latest` relizi: bo'lsa faqat APK yangilanadi
      # (--clobber), bo'lmasa yaratiladi. Sayt havolasi hech qachon
      # o'zgarmaydi.
      - name: Reliz (android-latest, prerelease)
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NOTES="Android APK. Doimiy havola: https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/e-kassam.apk"
          if gh release view android-latest > /dev/null 2>&1; then
            gh release upload android-latest e-kassam.apk --clobber
            gh release edit android-latest --notes "$TAG_NOTES ($GITHUB_REF_NAME)"
          else
            gh release create android-latest e-kassam.apk \
              --prerelease \
              --title "e-Kassam — Android" \
              --notes "$TAG_NOTES ($GITHUB_REF_NAME)"
          fi
