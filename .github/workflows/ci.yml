# ══════════════════════════════════════════════════════════════════════════
#  CI — har push va PR da: qurish · sinov · bandl byudjeti · a11y
#
#  ⚠ NEGA KERAK. Byudjet raqamlari 08-ROADMAP.md da bir marta yozilib,
#  keyin HECH KIM o'lchamagan; a11y esa umuman tekshirilmagan. Bitta
#  e'tiborsiz `import` bandlni ikki barobar oshiradi va buni faqat 4G
#  ulanishdagi kassir sezadi.
#
#  ⚠ Chrome runner'da OLDINDAN o'rnatilgan (`ubuntu-latest`), shuning
#  uchun `puppeteer-core` ishlatiladi — 120 MB lik Chromium yuklab
#  olinmaydi.
# ══════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Brauzerli qorovullar sekin: har biri Chrome ko'taradi. Chegara
    # ishning haqiqiy uzunligidan zaxira bilan katta.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Sinovlar
        run: npm test

      # BARCHA qorovullar shu yerda — qurish ham ular zanjirining
      # birinchi bandi (`package.json` dagi `check`).
      #
      # Ilgari bu yerda UCHTASI turardi: qurish, byudjet, a11y. Qolgan
      # 24 tasi CI da HECH QACHON ishlamagan — ular vaqt o'tib
      # `package.json` dagi zanjirga qo'shilgan, CI esa o'sha kungi
      # holatida qolib ketgan. Ro'yxatni ikki joyda yuritish har doim
      # shunday tugaydi, shuning uchun endi bitta manba bor.
      #
      # Buning narxi allaqachon to'langan: to'lov oynasi oltita ekran
      # o'lchamida scrol beradigan holatda 1.11.0 relizi ichida chiqib
      # ketdi. `check-pay` uni ushlagan bo'lardi — u CI da yo'q edi,
      # xolos. CI yashil turardi.
      - name: Qurish va qorovullar
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run check
