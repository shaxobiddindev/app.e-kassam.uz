name: Desktop ilova (.exe)

# Nega CI da quriladi:
#
# Ishlab chiqish mashinasida Windows "Smart App Control" yoqilgan va u
# `cargo` yangi kompilyatsiya qilgan build-skriptlarni ishga tushirishni
# bloklaydi (os error 4551). Uni o'chirish MUMKIN, lekin qaytarib yoqib
# bo'lmaydi — faqat Windows'ni qayta o'rnatish orqali. Shu sababli
# `.exe` toza runner'da yig'iladi.
#
# Bu baribir to'g'riroq: relizni bir odamning kompyuteri emas, takrorlanadigan
# muhit ishlab chiqaradi.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Reliz yaratish uchun kerak. Artifakt yuklash uchun kerak emas edi,
    # shuning uchun ilgari yo'q edi.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Rust bog'liqliklari kesh'lanadi — birinchi qurishdan keyin
      # keyingilari ~10 daqiqadan ~2 daqiqaga tushadi.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bog'liqliklar
        run: npm ci

      - name: Qurish
        run: npm run desktop:build

      # Ikkalasi ham yuklanadi: o'rnatuvchi oddiy foydalanuvchi uchun,
      # yalang'och `.exe` esa tez sinash uchun.
      #
      # ⚠ Artifakt — ISHLAB CHIQUVCHI uchun: uni yuklash GitHub'ga kirishni
      # talab qiladi va 90 kundan keyin o'chadi. Kassaga beriladigan havola
      # PASTDAGI relizdan olinadi.
      - name: O'rnatuvchini yuklash
        uses: actions/upload-artifact@v4
        with:
          name: e-Kassam-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/e-kassam.exe
          if-no-files-found: error

      # ── Reliz ────────────────────────────────────────────────────────────
      # Tauri o'rnatuvchini VERSIYALI nom bilan quradi
      # (`e-Kassam_1.1.0_x64-setup.exe`). Lekin e-kassam.uz dagi «Yuklab olish»
      # tugmasiga DOIMIY havola kerak, aks holda har relizda saytni tahrirlash
      # kerak bo'lardi. Shuning uchun ayni fayl IKKI nom bilan qo'yiladi:
      #   • versiyali  — qaysi build ekani nomidan ko'rinsin
      #   • `e-Kassam-setup.exe` — o'zgarmas nom, sayt shunga bog'lanadi:
      #     /releases/latest/download/e-Kassam-setup.exe
      - name: Reliz fayllarini tayyorlash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
                   Select-Object -First 1
          if (-not $setup) { throw "NSIS o'rnatuvchisi topilmadi" }
          Copy-Item $setup.FullName (Join-Path release $setup.Name)
          Copy-Item $setup.FullName (Join-Path release "e-Kassam-setup.exe")
          Get-ChildItem release | Format-Table Name, Length

      # Faqat tegdan. `workflow_dispatch` bilan qo'lda qurilgan build sinov
      # uchun — u foydalanuvchiga ko'rinadigan relizni almashtirmasligi kerak.
      #
      # `gh` runner'da allaqachon o'rnatilgan, uchinchi tomon action'i kerak emas.
      - name: Reliz yaratish
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag (Get-ChildItem release/*.exe | ForEach-Object FullName) `
            --title "e-Kassam $($tag -replace '^desktop-v','') — Windows" `
            --notes "Windows uchun o'rnatuvchi. Doimiy havola: https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/e-Kassam-setup.exe"
