apply plugin: 'com.android.application'

android {
    namespace = "uz.ekassam.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uz.ekassam.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // build-apk.sh epoch-daqiqa asosida o'suvchi versionCode uzatadi —
        // har yangi APK eskisining USTIGA o'rnatiladi (ikkinchi ilova
        // bo'lib chiqmaydi). Qo'lda qurishda zaxira qiymatlar ishlaydi.
        versionCode project.hasProperty('appVersionCode') ? appVersionCode.toInteger() : 1
        versionName project.hasProperty('appVersionName') ? appVersionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* ⚠ DOIMIY IMZO SHART. Debug kalit HAR MASHINADA (va har CI runner'da)
       HAR XIL — birinchi relizlar shu tufayli bir-birining ustiga
       o'rnatilmasdi: Android boshqa imzoli APK'ni yangilanish deb qabul
       qilmaydi va foydalanuvchi «o'rnata olmayapman» deb qaytadi.
       Kalit yo'llari propertydan (CI: secrets; lokal: build-apk.sh
       C:\Users\shaxo\ekassam-android-kalit dan uzatadi). */
    signingConfigs {
        release {
            if (project.hasProperty('signKeystore')) {
                storeFile file(signKeystore)
                storePassword signPassword
                keyAlias 'ekassam'
                keyPassword signPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('signKeystore')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    /* ══ Telegram «Native Login» SDK (V41) ═══════════════════════════════
       ⚠ AAR REPO ICHIDA (`app/libs/`), Maven'dan olinmaydi. Sababi: SDK
       FAQAT GitHub Packages'da va u ommaviy paket bo'lsa ham TOKENSIZ
       bermaydi (`401`). Token talab qilinsa, uni qo'ymagan har bir
       quruvchi — jumladan CI — ilovani NATIV KIRISHSIZ qurib qo'yardi va
       buni hech kim sezmasdi (aynan shunday bo'ldi: landingdagi APK da
       tugma yo'q edi). 27 KB fayl shu muammoni butunlay yopadi.

       ⚠ AAR ning o'z bog'liqliklari QO'LDA yozilgan: `libs` dan olingan
       fayl POM olib kelmaydi, ya'ni ular avtomatik qo'shilmaydi. Ro'yxat
       SDK ning POM idan (kotlin-stdlib, core-ktx, browser, coroutines). */
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.browser:browser:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
