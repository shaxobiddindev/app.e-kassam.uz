apply plugin: 'com.android.application'

android {
    namespace = "uz.ekassam.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uz.ekassam.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // build-apk.sh epoch-daqiqa asosida o'suvchi versionCode uzatadi —
        // har yangi APK eskisining USTIGA o'rnatiladi (ikkinchi ilova
        // bo'lib chiqmaydi). Qo'lda qurishda zaxira qiymatlar ishlaydi.
        versionCode project.hasProperty('appVersionCode') ? appVersionCode.toInteger() : 1
        versionName project.hasProperty('appVersionName') ? appVersionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* ⚠ DOIMIY IMZO SHART. Debug kalit HAR MASHINADA (va har CI runner'da)
       HAR XIL — birinchi relizlar shu tufayli bir-birining ustiga
       o'rnatilmasdi: Android boshqa imzoli APK'ni yangilanish deb qabul
       qilmaydi va foydalanuvchi «o'rnata olmayapman» deb qaytadi.
       Kalit yo'llari propertydan (CI: secrets; lokal: build-apk.sh
       C:\Users\shaxo\ekassam-android-kalit dan uzatadi). */
    signingConfigs {
        release {
            if (project.hasProperty('signKeystore')) {
                storeFile file(signKeystore)
                storePassword signPassword
                keyAlias 'ekassam'
                keyPassword signPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('signKeystore')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

/* ══ Telegram «Native Login» SDK bor-yo'qligi (V41) ═══════════════════════
   SDK FAQAT GitHub Packages'da va u TOKENSIZ bermaydi (`401`). Token
   bo'lmasa ilova AVVALGIDEK quriladi — shunchaki nativ kirish tugmasi
   bo'lmaydi: plagin manbasi kompilyatsiyaga qo'shilmaydi va ilova buni
   ish paytida o'zi sezadi.

   ⚠ Aks holda tokeni yo'q har bir quruvchida (va CI da) BUTUN APK yig'ilmay
   qolardi — bitta ixtiyoriy imkoniyat uchun bu juda qimmat. */
def tgLoginSdk = (project.findProperty('gpr.key') ?: System.getenv('GHPR_TOKEN')) ? true : false

android {
    sourceSets {
        main {
            if (tgLoginSdk) java.srcDirs += 'src/telegram/java'
        }
    }
}

dependencies {
    if (tgLoginSdk) implementation 'org.telegram:login-sdk:1.0.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
