// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()

        /* ══ Telegram «Native Login» SDK (V41) ═══════════════════════════
           ⚠ SDK FAQAT GitHub Packages'da: Maven Central'da yo'q va u
           kredensialsiz `401` qaytaradi (GitHub'ning ma'lum cheklovi —
           ommaviy paket ham token talab qiladi). Shu sababli `gpr.user` /
           `gpr.key` kerak:
             · lokalda — `~/.gradle/gradle.properties`;
             · CI da — `GITHUB_ACTOR` va `GHPR_TOKEN` muhit o'zgaruvchilari.

           ⚠ Token TOPILMASA ombor RO'YXATGA QO'SHILMAYDI: shunda xato
           «401» emas, «bunday bog'liqlik topilmadi» bo'lib chiqadi va
           sababi darrov ko'rinadi. */
        def gprUser = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
        def gprKey  = findProperty('gpr.key')  ?: System.getenv('GHPR_TOKEN')
        if (gprUser && gprKey) {
            maven {
                name = 'TelegramLoginSdk'
                url = uri('https://maven.pkg.github.com/TelegramMessenger/telegram-login-android')
                credentials {
                    username = gprUser
                    password = gprKey
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
